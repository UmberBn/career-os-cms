openapi: 3.0.3
info:
  title: CareerOS Content API
  description: >
    Read-only access to CareerOS professional identity data hosted on Strapi.
    Relations and components are populated by the server. Do not send populate query params.
  version: 1.0.0

servers:
  - url: https://REPLACE_WITH_NGROK_HOST
    description: Temporary HTTPS tunnel to local Strapi (replace host each ngrok session)

security:
  - bearerAuth: []

paths:
  /api/profile:
    get:
      operationId: getProfile
      summary: Get professional profile
      description: Single Type with languages and availability.
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
      responses:
        '200':
          description: Profile document
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden

  /api/companies:
    get:
      operationId: listCompanies
      summary: List companies
      description: Includes related experiences (title, type, dates). Omits reference contacts.
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Company list
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden

  /api/companies/{documentId}:
    get:
      operationId: getCompany
      summary: Get one company
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Company document
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/experiences:
    get:
      operationId: listExperiences
      summary: List experiences
      description: Includes company and projects with narrative, technologies, achievements, and links.
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Experience list
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden

  /api/experiences/{documentId}:
    get:
      operationId: getExperience
      summary: Get one experience
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Experience document
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/projects:
    get:
      operationId: listProjects
      summary: List projects
      description: Includes narrative, technologies, achievements, links, and related experience with company.
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Project list
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden

  /api/projects/{documentId}:
    get:
      operationId: getProject
      summary: Get one project
      parameters:
        - $ref: '#/components/parameters/NgrokSkipBrowserWarning'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Project document
        '401':
          description: Missing or invalid API token
        '403':
          description: Forbidden
        '404':
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
      description: Strapi API Token with Read-only access. Configure the value in the Custom GPT Action authentication UI; do not embed it in this file.

  parameters:
    NgrokSkipBrowserWarning:
      name: ngrok-skip-browser-warning
      in: header
      required: false
      schema:
        type: string
        default: 'true'
      description: Required when the server is an ngrok free-tier tunnel to avoid the HTML interstitial page.

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
      description: Strapi documentId of the entry.

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
